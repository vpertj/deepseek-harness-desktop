name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.1.23)'
        required: true
        default: 'v0.1.23'

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      # On tag push: github.ref_type == 'tag' and github.ref_name == 'v0.1.26'.
      # On dispatch: github.ref_type == 'branch' and inputs.tag == 'v0.1.26'.
      TAURI_ENV_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      # Explicit SDKROOT avoids macOS SDK 26.5 resolving the wrong framework
      # path for the objc notification crate (Cocoa/Cocoa.h not found).
      SDKROOT: macosx
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag (Cargo.toml + tauri.conf.json)
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version="${VERSION#v}"
          sed -i.bak "s/^version = \".*\"/version = \"$version\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          DSH_VERSION="$version" node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version=process.env.DSH_VERSION;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');console.log('tauri.conf.json -> version',d.version)"
          grep '^version' src-tauri/Cargo.toml

      - name: Build (frontend + app + dmg)
        run: npm install && npm run tauri build

      - name: Upload macOS artifacts
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          generate_release_notes: true

      - name: Upload artifacts (dispatch only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  build-windows:
    runs-on: windows-latest
    # The Windows bundle has never produced a green build; the macOS dmg is the
    # shipped artifact. Keep the job visible (a red job still shows up) without
    # failing the whole Release run and muddying the published release.
    continue-on-error: true
    env:
      TAURI_ENV_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag (Cargo.toml + tauri.conf.json)
        # `shell: bash` is required: the body is POSIX shell, and windows-latest
        # defaults to pwsh, which failed on `sed -i.bak "s/^version = \".*\"/…"`
        # with "Missing property name after reference operator".
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version="${VERSION#v}"
          sed -i.bak "s/^version = \".*\"/version = \"$version\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          DSH_VERSION="$version" node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version=process.env.DSH_VERSION;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');console.log('tauri.conf.json -> version',d.version)"
          grep '^version' src-tauri/Cargo.toml

      - name: Install MSVC toolchain
        run: |
          # Windows 2025 runner has MSVC pre-installed; no extra action needed.
          Write-Host "MSVC toolchain already available on windows-2025"

      - name: Build (frontend + app + nsis)
        run: npm install && npm run tauri build

      - name: Upload Windows artifacts
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: false

      - name: Upload artifacts (dispatch only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/release/bundle/nsis/*.exe
