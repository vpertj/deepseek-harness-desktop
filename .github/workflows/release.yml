name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      # Pass the git tag version (strip leading "v") into the Tauri build so
      # the resulting .app and .dmg carry the right version in their bundle ID
      # and filename — otherwise every tag bundles as the hardcoded Cargo.toml
      # version (0.1.18) and later releases get a 404 on app-update download.
      TAURI_ENV_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag (Cargo.toml + tauri.conf.json)
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Cargo.toml (Rust crate version)
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          grep '^version' src-tauri/Cargo.toml
          # tauri.conf.json (app bundle / DMG name)
          python3 -c "
  import json, sys
  p = 'src-tauri/tauri.conf.json'
  d = json.load(open(p))
  d['version'] = '$VERSION'
  json.dump(d, open(p, 'w'), indent=2, ensure_ascii=False)
  print(f'tauri.conf.json → version {d[\"version\"]}')"

      - name: Build (frontend + app + dmg)
        run: npm install && npm run tauri build

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          generate_release_notes: true
